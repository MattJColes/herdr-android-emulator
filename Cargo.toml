[package]
name = "herdr-android-emulator"
version = "0.1.0"
edition = "2024"
description = "An Android emulator in a herdr pane: agents drive it with a CLI and read its logs, crashes and events."
license = "MIT"
repository = "https://github.com/MattJColes/herdr-android-emulator"

[[bin]]
name = "herdr-android"
path = "src/main.rs"

[profile.release]
strip = true
