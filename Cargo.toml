[package]
name = "herdr-android-emulator"
version = "1.2.1"
edition = "2024"
description = "An Android emulator in a herdr pane: agents drive it with a CLI and read its logs, crashes and events."
license = "MIT"
repository = "https://github.com/MattJColes/herdr-android-emulator"

[[bin]]
name = "herdr-android"
path = "src/main.rs"

[dependencies]
base64 = "0.23"
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
libc = "0.2"
png = "0.18"
prost = "0.14"
quick-xml = "0.42"
resvg = { version = "0.49", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.11"
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
toml = "1.1"
tonic = "0.14"
tonic-prost = "0.14"

[build-dependencies]
protoc-bin-vendored = "3"
tonic-prost-build = "0.14"

[profile.release]
strip = true
